repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: Verify uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Check formatting
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Type-check
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Test
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true

